spring.application.name=precificaodonto-backend
server.port=8080

# Desativa Flyway temporariamente enquanto nao chegamos no banco (Baby Step 5)
spring.flyway.enabled=false

# Conexao com o PostgreSQL do Docker Compose
spring.datasource.url=jdbc:postgresql://localhost:5432/precificaodonto
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (cria/atualiza tabelas automaticamente com base nas entidades)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
